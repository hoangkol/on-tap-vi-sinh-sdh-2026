<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Cổng ôn tập tương tác môn Vi sinh học (Nhiễm khuẩn &amp; Miễn dịch, Thuốc kháng sinh) Tuyển sinh Sau đại học – Cao học Khoa học Y sinh ĐH Y Dược TP.HCM (YDS) 2026." />
  <title>Ôn Tập Vi Sinh Y Học SĐH 2026 - ĐH Y Dược TP.HCM (YDS)</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f766e'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%23ffffff' stroke-width='4'/%3E%3Ccircle cx='27' cy='28' r='3.5' fill='%23ffffff'/%3E%3Ccircle cx='38' cy='36' r='3' fill='%2399f6e4'/%3E%3Cpath d='M32 10v6M32 48v6M10 32h6M48 32h6M16.5 16.5l4.2 4.2M43.3 43.3l4.2 4.2M47.5 16.5l-4.2 4.2M20.7 43.3l-4.2 4.2' stroke='%23ffffff' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- LỚP PHỦ ĐÓNG DRAWER TRÊN ĐIỆN THOẠI / TABLET -->
  <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

  <!-- SIDEBAR NAVIGATION -->
  <aside class="sidebar" id="sidebar" aria-label="Danh mục 7 chuyên đề Vi sinh">
    <div class="sidebar-header">
      <div class="sidebar-header-top">
        <span class="brand-badge">Đề cương SĐH 2026 • KHYS YDS</span>
        <button class="sidebar-close-btn" id="sidebarCloseBtn" type="button" aria-label="Đóng danh mục">✕</button>
      </div>
      <div class="sidebar-title">VI SINH Y HỌC</div>
      <div class="sidebar-subtitle">2 Chuyên đề Đề cương (7 Bài) • Mô phỏng • 168 Câu KSA</div>
    </div>

    <div class="overall-progress-box">
      <div class="progress-label-row">
        <span>Tiến độ trên thiết bị này</span>
        <strong id="overallProgressText">0 / 7 bài (0%)</strong>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="overallProgressFill"></div>
      </div>
      <div class="storage-note" id="storageStatusNote">💾 Lưu tạm trên trình duyệt thiết bị này (không đồng bộ)</div>
    </div>

    <div class="sidebar-search">
      <input type="search" id="lessonSearchInput" placeholder="🔍 Tìm nhanh bài học, kháng sinh, độc tố..." autocomplete="off" />
    </div>

    <nav class="nav-list" id="sidebarNav">
      <!-- Populated dynamically by app.js -->
    </nav>
  </aside>

  <!-- MAIN WRAPPER -->
  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle-btn" id="menuToggleBtn" type="button" title="Mở danh mục 7 bài" aria-label="Mở danh mục bài học">☰ <span class="hide-xs">Danh mục</span></button>
        <div class="breadcrumb" id="breadcrumb">Tổng quan Đề cương Vi sinh học Sau đại học 2026</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-outline topbar-btn" id="btnOverview" type="button" onclick="App.showOverview()" title="Về tổng quan 7 bài">
          <span>📋</span> <span class="hide-sm">Đề cương 7 bài</span><span class="show-sm-only">7 bài</span>
        </button>
        <button class="btn btn-accent topbar-btn" id="btnMockExam" type="button" onclick="App.showMockExam()" title="Phòng thi thử tổng hợp">
          <span>🎯</span> <span>Thi thử</span><span class="hide-sm"> Tổng hợp</span>
        </button>
        <button class="btn btn-outline topbar-btn" id="btnThemeToggle" type="button" onclick="App.toggleTheme()" title="Đổi giao diện Sáng/Tối">🌙 <span class="hide-sm">Giao diện tối</span></button>
      </div>
    </header>

    <main class="content-container" id="mainContent">
      <!-- Dynamic view rendered here -->
    </main>
  </div>

  <!-- THANH ĐIỀU HƯỚNG NHANH CHO ĐIỆN THOẠI (MOBILE BOTTOM BAR) -->
  <nav class="mobile-bottom-bar" aria-label="Điều hướng nhanh trên di động">
    <button type="button" class="mbb-item" onclick="App.openDrawer()">
      <span class="mbb-icon">☰</span>
      <span class="mbb-label">7 Bài</span>
    </button>
    <button type="button" class="mbb-item" id="mbbOverview" onclick="App.showOverview()">
      <span class="mbb-icon">📋</span>
      <span class="mbb-label">Đề cương</span>
    </button>
    <button type="button" class="mbb-item" id="mbbMock" onclick="App.showMockExam()">
      <span class="mbb-icon">🎯</span>
      <span class="mbb-label">Thi thử</span>
    </button>
    <button type="button" class="mbb-item" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
      <span class="mbb-icon">⬆️</span>
      <span class="mbb-label">Đầu trang</span>
    </button>
  </nav>

  <!-- Data & Logic Scripts -->
  <script src="data_part1.js"></script>
  <script src="data_part2.js"></script>
  <script src="questions_extra.js"></script>
  <script src="animations.js"></script>
  <script src="simulators.js"></script>
  <script src="app.js"></script>
</body>
</html>
